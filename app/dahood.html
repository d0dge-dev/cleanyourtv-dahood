<!doctype html>
<html><head><meta charset="utf-8"><title>Home</title>
<meta name="viewport" content="width=1920">
<!-- dahood launcher: the landing row (pinned apps and inputs, sorted by last use) and All apps. Same rules as index.html: ES5 for
     Chromium 68+, only transform and opacity animate, no flex gap. Talks to the CleanYourTV service on 127.0.0.1:8765 only. -->
<style>
:root{--ink:#f3f4f7;--ink2:rgba(243,244,247,.66);--night:#0a0b0f;--acc:#6fb6ff;--font:"LG Smart UI","Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--font)}
.glow{position:absolute;left:0;top:0;width:1920px;height:760px;opacity:0;transition:opacity .45s linear;will-change:opacity;
  background:radial-gradient(ellipse 1300px 720px at 26% -4%,rgba(var(--c),.4),transparent 70%)}
.glow.on{opacity:1}
.abs{position:absolute}
#clock{left:100px;top:62px;white-space:nowrap}
#time{font-size:64px;font-weight:500;letter-spacing:-.02em;display:inline-block;vertical-align:baseline}
#date{font-size:28px;color:#cfd3dc;display:inline-block;margin-left:22px;vertical-align:baseline}
#name{left:100px;top:152px;font-size:84px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
#sub{left:104px;top:262px;font-size:28px;color:#cdd3de;white-space:nowrap}
.pill{display:inline-block;height:64px;line-height:64px;padding:0 26px;border-radius:32px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
  font-size:26px;color:#e9ebf0;white-space:nowrap;transition:transform .15s}
.pill svg{width:28px;height:28px;vertical-align:-6px;margin-right:12px}
#bar{right:96px;top:60px}
.f{outline:6px solid #fff;outline-offset:6px;transform:scale(1.03);box-shadow:0 18px 36px rgba(0,0,0,.45);z-index:2}
.pill.f{outline-width:4px;outline-offset:4px}
#row{left:100px;top:350px;height:290px;width:1720px}
.tile{position:absolute;top:0;height:290px;border-radius:28px;overflow:hidden;transition:transform .15s;background:#1a1d25}
.tile .ic{position:absolute;left:50%;top:50%;width:170px;height:170px;margin:-85px 0 0 -85px}
.tile.in{background:linear-gradient(135deg,#0b2a6b 0%,#1747b8 55%,#2a6cf0 100%);text-align:center}
.tile.in svg{width:140px;height:140px;margin-top:38px}
.tile .lbl{font-size:28px;font-weight:650;margin-top:6px}
.tile .s2{font-size:20px;opacity:.8;margin-top:6px}
.tile.all{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);text-align:center;color:#dfe2e8;font-size:24px}
.tile.all svg{width:64px;height:64px;margin:88px 0 14px}
.tile .t{position:absolute;left:0;right:0;top:50%;margin-top:-20px;text-align:center;font-size:32px;font-weight:600}

/* All apps */
#all{left:0;top:0;width:1920px;height:1080px;background:var(--night);opacity:0;visibility:hidden;transition:opacity .2s linear;z-index:10}
#all.on{opacity:1;visibility:visible}
#all .bg{position:absolute;inset:0;left:0;top:0;width:1920px;height:1080px;background:radial-gradient(ellipse 1400px 800px at 50% -10%,rgba(80,110,170,.25),transparent 70%)}
#allTitle{left:100px;top:56px;font-size:56px;font-weight:700;letter-spacing:-.02em}
#allClock{right:96px;top:62px;font-size:40px;font-weight:500}
#allScroll{left:0;top:0;width:1920px;transition:transform .2s}
.sec{position:absolute;left:100px;font-size:26px;font-weight:600;color:#aab0bc}
.inp{position:absolute;top:206px;height:110px;width:300px;border-radius:22px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);
  padding:0 26px;font-size:26px;font-weight:600;white-space:nowrap;transition:transform .15s}
.inp svg{width:44px;height:44px;position:absolute;left:24px;top:33px}
.inp .tx{position:absolute;left:86px;top:28px;right:16px;overflow:hidden;text-overflow:ellipsis}
.inp small{display:block;font-size:18px;font-weight:400;color:#aab0bc;margin-top:3px}
.inp.pin{background:linear-gradient(135deg,#1747b8,#2a6cf0);box-shadow:none}
.inp.pin small{color:#dbe4ff}
.inp.off{opacity:.5}
.dot{width:12px;height:12px;border-radius:6px;background:#45d483;display:inline-block;margin-right:8px}
.gt{position:absolute;width:196px;height:196px;border-radius:26px;overflow:hidden;background:#1a1d25;transition:transform .15s}
.gt img{position:absolute;left:33px;top:33px;width:130px;height:130px}
.gt .t{position:absolute;left:8px;right:8px;top:80px;text-align:center;font-size:22px;font-weight:600}
.gl{position:absolute;width:196px;text-align:center;font-size:20px;color:#cfd3dc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast{position:absolute;left:50%;bottom:60px;width:900px;margin-left:-450px;text-align:center;font-size:26px;padding:18px;border-radius:18px;background:rgba(20,22,28,.95);opacity:0;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
</style></head>
<body>
<div class="glow" id="gA"></div><div class="glow" id="gB"></div>
<div class="abs" id="clock"><span id="time"></span><span id="date"></span></div>
<div class="abs" id="bar"></div>
<div class="abs" id="name"></div>
<div class="abs" id="sub"></div>
<div class="abs" id="row"></div>

<div class="abs" id="all">
  <div class="bg"></div>
  <div class="abs" id="allScroll">
    <div class="abs" id="allTitle"></div>
    <div class="sec" style="top:160px" id="secIn"></div>
    <div class="abs" id="inputs" style="left:0;top:0"></div>
    <div class="sec" style="top:368px" id="secApps"></div>
    <div class="abs" id="grid" style="left:100px;top:414px"></div>
    <div class="abs" id="allClock"></div>
  </div>
</div>
<div id="toast"></div>

<script>
var API='http://127.0.0.1:8765', VERSION='1.4.1501', CACHE_KEY='dahood.cache.v1';
function logm(m){try{fetch(API+'/api/log?m='+encodeURIComponent('dahood '+m))}catch(e){}}   /* ends up in /tmp/cleanyourtv-helper.log */
window.onerror=function(msg,src,line){logm('error '+msg+' @'+line)};
var PINS=['li.dahood.media','youtube.leanback.v4','com.webos.app.hdmi3'];          /* default; config.json "pins" overrides */
var PIN_NAMES={'com.webos.app.hdmi3':'PlayStation 5'};                               /* config.json "pinNames" overrides */
var GLOWS={'youtube.leanback.v4':'230,40,50','li.dahood.media':'60,120,200','netflix':'229,9,20','spotify-beehive':'30,215,96'};
var LOC=(window.webOSSystem&&webOSSystem.locale)||navigator.language||'en-GB';
var ICONS={
  pad:'<path d="M6 11h4M8 9v4M15 12h.01M18 10h.01"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59l-.9 7.2A2.8 2.8 0 0 0 4.6 19a2.8 2.8 0 0 0 2.24-1.12L8 16h8l1.16 1.88A2.8 2.8 0 0 0 19.4 19a2.8 2.8 0 0 0 2.8-3.21l-.9-7.2A4 4 0 0 0 17.32 5z"/>',
  hdmi:'<rect x="3" y="8" width="18" height="8" rx="1.5"/><path d="M7 16v2h10v-2M7 11h.01M11 11h.01M15 11h.01"/>',
  grid:'<rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'};
function svg(n,w){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(w||1.8)+'" stroke-linecap="round" stroke-linejoin="round">'+ICONS[n]+'</svg>'}
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function api(p,body){return fetch(API+p,body?{method:'POST',body:JSON.stringify(body)}:{}).then(function(x){return x.json()})}
var toastT=0;function toast(s){var e=$('toast');e.textContent=s;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){e.classList.remove('on')},4000)}
function launch(id){api('/api/launch',{id:id}).then(function(x){if(x&&x.returnValue===false)toast('Could not open '+id)}).catch(function(){toast('Service not reachable')})}
var isInput=function(id){return /^com\.webos\.app\.hdmi\d$/.test(id)};

/* ---------- state ---------- */
var apps=[],cfg={},last={},inputs=[],byId={};
try{var c0=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');if(c0){apps=c0.apps||[];cfg=c0.cfg||{};last=c0.last||{};inputs=c0.inputs||[]}}catch(e){}
function store(){try{localStorage.setItem(CACHE_KEY,JSON.stringify({apps:apps,cfg:cfg,last:last,inputs:inputs}))}catch(e){}}
function pins(){return (cfg.pins&&cfg.pins.length?cfg.pins:PINS).slice(0,3)}
function pinName(id){return (cfg.pinNames&&cfg.pinNames[id])||PIN_NAMES[id]||''}
function inputOf(id){for(var i=0;i<inputs.length;i++)if(inputs[i].appId===id)return inputs[i];return null}
var NOISE=['webos.day','com.webos.app.sportsteamsettings'];   /* LG promo apps nobody opens on purpose; config.json "hidden" adds more */
function hidden(id){return (cfg.hidden||[]).indexOf(id)>=0||NOISE.indexOf(id)>=0}
function byRecent(a,b){return (last[b]||0)-(last[a]||0)}

/* ---------- colours ---------- */
function hex2rgb(h){var n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255]}
function hashHue(id){var h=0;for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))%360;return h}
function hsl(h,s,l){var a=s*Math.min(l,1-l);function f(n){var k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))))}return [f(0),f(8),f(4)]}
function glowOf(id){
  if(GLOWS[id])return GLOWS[id];if(isInput(id))return '40,90,220';
  var a=byId[id];if(a&&a.color){var c=hex2rgb(a.color),mx=Math.max(c[0],c[1],c[2]),mn=Math.min(c[0],c[1],c[2]);if(mx-mn>50)return c.join(',')}
  return hsl(hashHue(id),.55,.45).join(',')}
function light(h){if(!h)return false;var c=hex2rgb(h);return c[0]*.3+c[1]*.59+c[2]*.11>170}
function dark(h){if(!h)return true;var c=hex2rgb(h);return c[0]*.3+c[1]*.59+c[2]*.11<40}
function tileBg(id,col){return dark(col)?'radial-gradient(120% 120% at 20% 10%,rgba('+glowOf(id)+',.45) 0%,#0f1622 60%,#0a0b0f 100%)':col}
var gSide=0,gColor='';
function glow(col){if(col===gColor)return;gColor=col;var on=gSide?$('gB'):$('gA'),off=gSide?$('gA'):$('gB');gSide^=1;on.style.setProperty('--c',col);on.classList.add('on');off.classList.remove('on')}

/* ---------- time ---------- */
var H24=true;
function hm(d){return d.toLocaleTimeString(LOC,{hour:'2-digit',minute:'2-digit',hour12:!H24})}
function tick(){var d=new Date();$('time').textContent=hm(d);$('allClock').textContent=hm(d);
  $('date').textContent=d.toLocaleDateString(LOC,{weekday:'long',day:'numeric',month:'long'})}
function lastText(ts){
  if(!ts)return 'Not used yet';
  var d=new Date(ts),now=new Date(),day=86400000,t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  if(ts>=t0)return 'Last used today, '+hm(d);
  if(ts>=t0-day)return 'Last used yesterday, '+hm(d);
  if(ts>=t0-6*day)return 'Last used '+d.toLocaleDateString(LOC,{weekday:'long'})+', '+hm(d);
  return 'Last used '+d.toLocaleDateString(LOC,{day:'numeric',month:'long'})}

/* ---------- landing ---------- */
var focusR=1,focusC=0,rows=[[],[]],allOpen=false,ar=0,ac=0,arows=[];
function img(id,cls){var i=new Image();i.className=cls||'';i.alt='';i.decoding='async';i.src=API+'/icon/'+encodeURIComponent(id);
  i.onerror=function(){var p=i.parentNode;if(!p)return;i.remove();var t=document.createElement('div');t.className='t';t.textContent=(byId[id]||{}).title||id;
    if(light((byId[id]||{}).color))t.style.color='#16181d';p.appendChild(t)};return i}
function pinTile(id,x){
  var d=document.createElement('div'),w=470;d.className='tile';d.style.left=x+'px';d.style.width=w+'px';d._id=id;
  if(isInput(id)){var inp=inputOf(id)||{},port=id.slice(-1);d.className+=' in';
    d.innerHTML=svg('pad',1.6)+'<div class="lbl">'+esc(pinName(id)||inp.label||'HDMI '+port)+'</div><div class="s2">'+esc((inp.label&&inp.label!=='HDMI '+port?inp.label+' · ':'')+'HDMI '+port)+'</div>';
    d._title=pinName(id)||inp.label||'HDMI '+port}
  else{var a=byId[id]||{title:id};d.style.background=tileBg(id,a.color);d.appendChild(img(id,'ic'));d._title=a.title}
  return d}
function build(){
  byId={};apps.forEach(function(a){byId[a.id]=a});
  var row=$('row'),bar=$('bar');row.textContent='';bar.textContent='';
  var ps=pins().filter(function(id){return isInput(id)?true:!!byId[id]}).sort(function(a,b){return byRecent(a,b)||pins().indexOf(a)-pins().indexOf(b)});
  var tl=ps.map(function(id,i){var t=pinTile(id,i*496);row.appendChild(t);return t});
  var all=document.createElement('div');all.className='tile all';all.style.left=(ps.length*496)+'px';all.style.width='232px';all._all=true;all._title='All apps';
  all.innerHTML=svg('grid')+'<div>All apps</div>';row.appendChild(all);tl.push(all);
  var set=document.createElement('div');set.className='pill';set._id='com.palm.app.settings';set._title='Settings';set.innerHTML=svg('gear',2)+'Settings';bar.appendChild(set);
  rows=[[set],tl];
  setFocus(1,0)}
function setFocus(r,c){
  var o=rows[focusR]&&rows[focusR][focusC];if(o)o.classList.remove('f');
  focusR=r;focusC=Math.max(0,Math.min(c,rows[r].length-1));var e=rows[focusR][focusC];e.classList.add('f');
  $('name').textContent=e._title||'';
  $('sub').textContent=e._all?(apps.length+' apps and '+inputs.length+' inputs'):e._id==='com.palm.app.settings'?'':lastText(last[e._id]);
  if(e._id)glow(glowOf(e._id))}
function activate(e){if(e._all)openAll();else if(e._id)launch(e._id)}

/* ---------- All apps ---------- */
function openAll(toInputs){
  allOpen=true;$('allTitle').textContent='All apps';$('secIn').textContent='Inputs';$('secApps').textContent='Apps';
  var ib=$('inputs'),gd=$('grid');ib.textContent='';gd.textContent='';
  var ins=inputs.filter(function(d){return d.appId}).map(function(d,i){
    var e=document.createElement('div'),port='HDMI '+d.port,pinned=pins().indexOf(d.appId)>=0;
    e.className='inp'+(pinned?' pin':'')+(d.hdmiPlugIn?'':' off');e.style.left=(100+i*330)+'px';e._id=d.appId;
    var sub=(d.label&&d.label!==port?port+' · ':'')+(d.hdmiPlugIn?'connected':'not connected');
    e.innerHTML=svg(pinned?'pad':'hdmi',2)+'<div class="tx">'+esc(d.label||port)+'<small>'+(d.hdmiPlugIn?'<span class="dot"></span>':'')+esc(sub)+'</small></div>';
    ib.appendChild(e);return e});
  var list=apps.filter(function(a){return !hidden(a.id)}).sort(function(a,b){return byRecent(a.id,b.id)||(a.title<b.title?-1:1)});
  var g=list.map(function(a,i){var col=i%8,rw=Math.floor(i/8),x=col*218,y=rw*262;
    var t=document.createElement('div');t.className='gt';t.style.left=x+'px';t.style.top=y+'px';t.style.background=tileBg(a.id,a.color);t._id=a.id;t.appendChild(img(a.id));gd.appendChild(t);
    var l=document.createElement('div');l.className='gl';l.style.left=x+'px';l.style.top=(y+208)+'px';l.textContent=a.title;gd.appendChild(l);return t});
  arows=[ins];for(var i=0;i<g.length;i+=8)arows.push(g.slice(i,i+8));
  if(!ins.length)arows.shift();
  $('all').classList.add('on');aFocus(toInputs||!g.length?0:Math.min(1,arows.length-1),0)}
function closeAll(){allOpen=false;$('all').classList.remove('on');var o=arows[ar]&&arows[ar][ac];if(o)o.classList.remove('f')}
function aFocus(r,c){
  var o=arows[ar]&&arows[ar][ac];if(o)o.classList.remove('f');
  ar=r;ac=Math.max(0,Math.min(c,arows[r].length-1));var e=arows[ar][ac];e.classList.add('f');
  var gr=ar-(arows[0]&&arows[0][0]&&arows[0][0].className.indexOf('inp')>=0?1:0),sh=0;   /* scroll so the focused grid row stays on screen */
  if(gr>=1){var bottom=414+gr*262+196+60;sh=Math.min(0,1080-40-bottom)}
  $('allScroll').style.transform=sh?'translateY('+sh+'px)':''}

/* ---------- keys ---------- */
var BACK=[461,27,8];
document.addEventListener('keydown',function(e){
  var k=e.keyCode;
  if(allOpen){
    if(BACK.indexOf(k)>=0){closeAll();e.preventDefault();return}
    if(k===37)aFocus(ar,ac-1);else if(k===39)aFocus(ar,ac+1);
    else if(k===38&&ar>0)aFocus(ar-1,ar-1===0&&arows[0][0].className.indexOf('inp')>=0?Math.round(ac*330/218):ac);
    else if(k===40&&ar<arows.length-1)aFocus(ar+1,ar===0&&arows[0][0].className.indexOf('inp')>=0?Math.round(ac*218/330):ac);
    else if(k===13){var x=arows[ar][ac];if(x&&x._id){launch(x._id);setTimeout(closeAll,600)}}
    else return;
    e.preventDefault();return}
  if(k===37)setFocus(focusR,focusC-1);else if(k===39)setFocus(focusR,focusC+1);
  else if(k===38&&focusR>0)setFocus(0,0);else if(k===40&&focusR===0)setFocus(1,0);
  else if(k===13)activate(rows[focusR][focusC]);
  else return;
  e.preventDefault()});
document.addEventListener('click',function(e){var t=e.target;while(t&&!t._id&&!t._all)t=t.parentNode;if(t){if(allOpen)launch(t._id);else activate(t)}});

/* ---------- data ---------- */
var lastSig='';
function load(){
  Promise.all([api('/api/apps'),api('/api/inputs').catch(function(){return {}})]).then(function(x){
    var a=x[0],ins=(x[1].devices||[]).filter(function(d){return d.appId});
    cfg=a.config||{};H24=cfg.clock!=='12';last=a.lastUsed||{};inputs=ins;
    apps=a.apps.map(function(p){return {id:p.id,title:p.title,color:p.color||''}});
    var sig=JSON.stringify([apps,cfg.pins,cfg.pinNames,cfg.hidden,last,ins.map(function(d){return [d.appId,d.label,d.hdmiPlugIn]})]);
    tick();store();if(sig!==lastSig){lastSig=sig;if(!allOpen)build()}
  }).catch(function(){toast('Service not reachable, retrying...');setTimeout(load,3000)})}
function home(){if(allOpen)closeAll();if(rows[1].length)setFocus(1,0);load()}
function params(){var p={};try{p=JSON.parse(webOSSystem.launchParams||'{}')}catch(e){}return p}
/* Home relaunches us (keepAlive) on every Home press, sometimes twice, and launchParams can already be overwritten by the time
   the event runs. So both events only schedule one wake-up that reads the params once things settled. */
var wakeT=0;
function wake(){clearTimeout(wakeT);wakeT=setTimeout(function(){var p=params();if(p.inputs){if(allOpen)closeAll();load();openAll(true)}else home()},250)}
document.addEventListener('webOSRelaunch',function(){logm('relaunch '+JSON.stringify(params()));wake()});
document.addEventListener('visibilitychange',function(){if(!document.hidden)wake()});
tick();setInterval(tick,10000);
if(apps.length){byId={};apps.forEach(function(a){byId[a.id]=a});build()}
load();setInterval(function(){if(!document.hidden&&!allOpen)load()},60000);
if(params().inputs)setTimeout(function(){openAll(true)},600);
api('/api/frontend-ok',{version:VERSION}).catch(function(){});
</script>
</body></html>
